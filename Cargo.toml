[package]
name = "mig"
version = "0.1.12"
edition = "2024"
rust-version = "1.97"
description = "A tool that shows what changed in a file"
autobins = false
default-run = "m"

[features]
fixture-bins = []

[[bin]]
name = "m"
path = "src/main.rs"

[[bin]]
name = "f"
path = "src/bin/f.rs"
required-features = ["fixture-bins"]

[[bin]]
name = "fw"
path = "src/bin/fw.rs"
required-features = ["fixture-bins"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
gix = { version = "0.87.1", default-features = false, features = ["max-performance", "revparse-regex", "sha1", "sha256", "status"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
tree-sitter = "0.26.11"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-nix = "0.3.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.23.0"

[lints.clippy]
mod_module_files = "deny"
