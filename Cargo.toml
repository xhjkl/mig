[package]
name = "mig"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A tool that shows what changed in a file"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
tree-sitter = "0.26.11"
tree-sitter-rust = "0.24.2"
unicode-width = "0.2.2"
