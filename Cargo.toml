[workspace]
members = ["core", "cli"]
default-members = ["cli"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
anyhow = "1.0.104"
mig-core = { path = "core" }
tree-sitter = "0.26.11"

[workspace.lints.clippy]
mod_module_files = "deny"
